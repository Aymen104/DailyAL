name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [tenrai-fix]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Prepare Gradle 8.14.3 wrapper and release signing
        run: |
          curl -fsSL -o /tmp/gradle-8.14.3-bin.zip \
            https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q /tmp/gradle-8.14.3-bin.zip -d "$RUNNER_TEMP"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/tenrai_patch.jks" \
            -storepass android -keypass android -alias tenrai \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Tenrai Patch,O=DailyAL Patched,C=MA"
          {
            echo "storePassword=android"
            echo "keyPassword=android"
            echo "keyAlias=tenrai"
            echo "storeFile=$RUNNER_TEMP/tenrai_patch.jks"
          } > android/key.properties.file
          cd android
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" wrapper \
            --gradle-version 8.14.3 --distribution-type bin

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyal-tenrai-patched
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error